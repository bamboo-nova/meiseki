# やさしい日本語ガイドライン由来の検出辞書（meiseki:yorisoi 用）
#
# - この辞書は「検出専用」。textlint --fix による自動置換はしない。
#   expected はリライト方針のヒントであり、置換文字列ではない。
# - 各ルールの根拠は「在留支援のためのやさしい日本語ガイドライン」
#   （出入国在留管理庁・文化庁、2020年8月）の該当ステップ。
#   https://www.moj.go.jp/isa/support/portal/plainjapanese_guideline.html
# - 指摘＝書き換え確定ではない。畳めない専門用語・固有名詞は
#   「余震＜＝後から来る地震＞」の形式で残す（patterns-yorisoi.md YF）。
# - A1 補完セクションは meiseki 本体の prh-llm-phrases.yml と同じパターン。
#   no-double-negative-ja が拾えない分離型・丁寧形の二重否定を補完する。
version: 1
rules:
  # --- A1 補完：no-double-negative-ja が拾えない二重否定（meiseki 本体と同一） ---
  - pattern: /ないとは(?:言え|いえ)(?:ない|ません)/
    expected: 肯定に畳む（真偽を反転させない）
    prh: A1 二重否定「〜ないとは言えない」。例「招かないとは言えません」→「招くことがあります」。
  - pattern: /なくはない/
    expected: 肯定に畳む（真偽を反転させない）
    prh: A1 二重否定「〜なくはない」。肯定表現に畳む。
  - pattern: /(?<!仮説[^。、]{0,15})否定でき(?:ない|ません)/
    expected: 肯定に畳む（真偽を反転させない）
    prh: A1 二重否定「〜は否定できない」。例「可能性は否定できません」→「可能性があります」。
  - pattern: /ないわけが(?:ない|ありません)/
    expected: 肯定に畳む（真偽を反転させない）
    prh: A1 二重否定「〜ないわけがない」。肯定表現に畳む。
  - pattern: /ないわけではありません/
    expected: 肯定に畳む（真偽を反転させない）
    prh: A1 二重否定「〜ないわけではありません」（丁寧形）。肯定表現に畳む。
  - pattern: /ないと(?:は|も)限りません/
    expected: 肯定に畳む（真偽を反転させない）
    prh: A1 二重否定「〜ないとは限りません」（丁寧形）。肯定表現に畳む。
  - pattern: /ないこと(?:は|も)ありません/
    expected: 肯定に畳む（真偽を反転させない）
    prh: A1 二重否定「〜ないこともありません」（丁寧形）。肯定表現に畳む。
  - pattern: /なく(?:は|も)ありません/
    expected: 肯定に畳む（真偽を反転させない）
    prh: A1 二重否定「〜なくもありません」（丁寧形）。肯定表現に畳む。
  # --- YC 受身の近似検出（ガイドライン ステップ2「受身形はできるだけ使わない」） ---
  # 正規表現による近似のため誤検知がある（可能形・自発の「される」も拾う）。
  # 動作主を主語に立て直せるかは LLM が文脈判断する。
  - pattern: /[さら]れ(?:ます|ました|ています|ている)/
    expected: 動作主を主語にして能動で書く（例「市が配ります」）
    prh: YC 受身の可能性。「〜が配布されます」「〜が求められます」→「（市役所が）配ります」のように、する人を主語にできないか確認する。可能形・尊敬の「られます」も拾うため、受身でなければ無視してよい。
  - pattern: /させられ/
    expected: 使役受身をやめ、動作を分けて書く
    prh: YC 使役受身。「書かされます」等は「〜と言われます。書いてください」のように分けて書く。
  # --- YD 推測・曖昧表現（ステップ2「推測表現は使わない」「曖昧な表現は避ける」） ---
  - pattern: /おそらく/
    expected: 言い切るか「〜かもしれません」にする
    prh: YD 推測表現「おそらく」。ガイドラインは推測表現を避け、断定か「かもしれません」を推奨する。
  - pattern: /と思われ(?:ます|る)/
    expected: 言い切るか「〜かもしれません」にする
    prh: YD 推測表現「〜と思われます」。断定できるなら言い切る。
  - pattern: /(?:おそれ|恐れ)があります/
    expected: 「〜かもしれません」に言い換える
    prh: YD 推測表現「〜おそれがあります」。ガイドラインの書き換え例は「〜かもしれません」。
  - pattern: /ようです。/
    expected: 言い切るか「〜かもしれません」にする
    prh: YD 推測表現「〜ようです」。伝聞・推測をやめ、分かっていることを言い切る。
  - pattern: /結構です/
    expected: 「よい」か「いらない」か、意味を確定して書く
    prh: YD 多義表現「結構です」。肯定にも断りにも読めるため、どちらかを明確に書く。
  - pattern: /等(?:の|を|が|に|で|は|も)/
    expected: 「など」に開くか、対象をすべて書く
    prh: YD 「等」。読みが二通りある漢字表記を避け、「など」と書くか対象を列挙する。
  # --- YE 敬語の単純化（ステップ2「敬語は丁寧語を使う」＝尊敬語・謙譲語は使わない） ---
  - pattern: /いらっしゃ/
    expected: 「来ます」「います」など丁寧語にする
    prh: YE 尊敬語「いらっしゃる」。丁寧語（です・ます）だけを使う。
  - pattern: /召し上が/
    expected: 「食べます」「飲みます」にする
    prh: YE 尊敬語「召し上がる」。丁寧語だけを使う。
  - pattern: /ご覧/
    expected: 「見てください」にする
    prh: YE 尊敬語「ご覧ください」。「見てください」と書く。
  - pattern: /お越し/
    expected: 「来てください」にする
    prh: YE 尊敬語「お越しください」。「来てください」と書く。
  - pattern: /(?:申し上げ|申しあげ)/
    expected: 丁寧語の普通の動詞にする
    prh: YE 謙譲語「申し上げる」。「言います」「お願いします」など丁寧語にする。
  - pattern: /伺(?:い|っ|う)/
    expected: 「聞きます」「行きます」にする
    prh: YE 謙譲語「伺う」。「聞きます」「行きます」と書く。
  - pattern: /ございま/
    expected: 「あります」「です」にする
    prh: YE 「ございます」。「あります」「です」と書く。
  # --- YG 表記（ステップ2・別冊：西暦、12時間表示＋午前/午後、範囲は「から〜まで」） ---
  - pattern: /(?:令和|平成|昭和)(?:[0-9０-９]+|元)年/
    expected: 西暦で書く（併記も可）
    prh: YG 元号。外国人には分かりにくいため西暦で書く（例「令和2年」→「2020年」）。
  - pattern: /(?:[0-9０-９]|[時分日月年])\s*[〜～]/
    expected: 「AからBまで」と書く
    prh: YG 範囲記号「〜」。「10時〜12時」は「10時から12時まで」と書く。
  - pattern: /(?:1[3-9]|2[0-4])時/
    expected: 午前・午後をつけた12時間表示にする
    prh: YG 24時間表示。「18時」は「午後6時」のように書く。
  - pattern: /[0-9０-９]{1,4}\/[0-9０-９]{1,2}\/[0-9０-９]{1,2}/
    expected: 「2020年7月10日」のように書く
    prh: YG 日付のスラッシュ表記。「2020/7/10」は「2020年7月10日」と書く。
