# LLM 定型句の検出辞書（カテゴリ G 用）＋ 二重否定の補完辞書
#
# - この辞書は「検出専用」。textlint --fix による自動置換はしない。
#   expected はリライト方針のヒントであり、置換文字列ではない。
# - 例外セクション「A1 補完」：`no-double-negative-ja`（カテゴリ A）が拾えないと
#   実測で確認できた二重否定だけを補完する。具体的には
#   (1) 分離型（「〜ないとは言えない」「〜なくはない」「〜は否定できない」「〜ないわけがない」）、
#   (2) 丁寧形（「〜ないわけではありません」「〜ないとは限りません」等。本家は終止形しか拾わない）。
#   RLS 集計上は通常の prh 指摘（重み 1）として数える。畳み方の基準（真偽を反転
#   させない）と litotes を残す判断は LLM 層（SKILL.md §5 / patterns.md A）が行う。
# - 指摘＝削除確定ではない。語が文脈で実質を持つ場合（本当に多角的な比較を
#   した直後の「多角的」など）は残す。最終判断は LLM 層（patterns.md の G）が行う。
# - 正当な用法が多い語（「総合的」「要するに」など）は誤検知を避けるため
#   辞書に入れず、LLM 判断に残している。
# - 語彙の選定は k16shikano 氏の「日本語技術文書の文章規範」
#   (https://gist.github.com/k16shikano/fd287c3133457c4fd8f5601d34aa817d)
#   の「LLM っぽい空句の禁止」を参考にした。
version: 1
rules:
  # --- A1 補完：no-double-negative-ja が拾えない二重否定（実測で未検出を確認した形のみ） ---
  # 分離型（終止形でも未検出）
  - pattern: /ないとは(?:言え|いえ)(?:ない|ません)/
    expected: 肯定に畳む（真偽を反転させない）
    prh: A1 補完 二重否定「〜ないとは言えない」。例「招かないとは言えません」→「招くことがある」。「招かない」への畳みは論理の反転＝誤訳。
  - pattern: /なくはない/
    expected: 肯定に畳む（真偽を反転させない）
    prh: A1 補完 二重否定「〜なくはない」。控えめな肯定（litotes）が本質なら残してよい。
  # 統計の術語「(帰無)仮説は否定できない」は検定の結論であり畳めないため、
  # 直前 15 文字以内(句読点を挟まない)に「仮説」がある場合は除外する。
  - pattern: /(?<!仮説[^。、]{0,15})否定でき(?:ない|ません)/
    expected: 肯定に畳む（真偽を反転させない）
    prh: A1 補完 二重否定「〜は否定できない」。例「可能性は否定できません」→「可能性があります」。
  - pattern: /ないわけが(?:ない|ありません)/
    expected: 肯定に畳む（真偽を反転させない）
    prh: A1 補完 二重否定「〜ないわけがない」。例「知らないわけがない」→「必ず知っている」。
  # 丁寧形（本家は終止形「〜ない」しか拾わない）
  - pattern: /ないわけではありません/
    expected: 肯定に畳む（真偽を反転させない）
    prh: A1 補完 二重否定「〜ないわけではありません」（丁寧形）。例「使えないわけではありません」→「使えます（ただし〜）」。
  - pattern: /ないと(?:は|も)限りません/
    expected: 肯定に畳む（真偽を反転させない）
    prh: A1 補完 二重否定「〜ないとは限りません」（丁寧形）。例「失敗しないとは限りません」→「失敗することがあります」。
  - pattern: /ないこと(?:は|も)ありません/
    expected: 肯定に畳む（真偽を反転させない）
    prh: A1 補完 二重否定「〜ないこともありません」（丁寧形）。肯定表現に畳む。
  - pattern: /なく(?:は|も)ありません/
    expected: 肯定に畳む（真偽を反転させない）
    prh: A1 補完 二重否定「〜なくもありません」（丁寧形）。肯定表現に畳む。
  # --- G1 予告と総括 ---
  - pattern: /に他な(?:らない|りません)/
    expected: 断定をそのまま書く
    prh: G1 「〜に他ならない」は中身を足さない強調。主張を普通の断定で書く。
  - pattern: /重要なのは/
    expected: 主張をそのまま書く
    prh: G1 「重要なのは〜」は主張の予告。予告の枠を外して主張を直接書く。
  - pattern: /見ていき(?:ましょう|ます)/
    expected: 予告を削って本題から入る
    prh: G1 「〜を見ていきます」は空の予告。本題をそのまま書き始める。
  # --- G2 空虚な形容 ---
  - pattern: /多角的/
    expected: 何をどう見たかを書く
    prh: G2 「多角的」は観点の中身を示さない形容。実際の観点を書くか削る。
  - pattern: /包括的/
    expected: 何を網羅したかを書く
    prh: G2 「包括的」は範囲の中身を示さない形容。実際の範囲を書くか削る。
  - pattern: /不可欠/
    expected: なぜ必要かを書く
    prh: G2 「不可欠」は理由を示さない強調。根拠が本文にあるなら具体的に言い切る。
  - pattern: /鍵となる/
    expected: 何がどう効くかを書く
    prh: G2 「鍵となる」は働きを示さない強調。働きを書くか削る。
  - pattern: /非常に/
    expected: 削るか具体的な程度を書く
    prh: G2 「非常に」は中身のない強調。削っても主張は変わらないことが多い。
  - pattern: /極めて/
    expected: 削るか具体的な程度を書く
    prh: G2 「極めて」は中身のない強調。削っても主張は変わらないことが多い。
  # --- G3 空虚な動詞 ---
  - pattern: /掘り下げ/
    expected: 何をどう調べる・書くかを言う
    prh: G3 「掘り下げる」は動作の中身を示さない動詞。実際の動作で言い換える。
  - pattern: /深掘り/
    expected: 何をどう調べる・書くかを言う
    prh: G3 「深掘り」は動作の中身を示さない動詞。実際の動作で言い換える。
